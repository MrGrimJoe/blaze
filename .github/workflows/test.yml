name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - run: pip install -r requirements.txt pytest
      - run: npm install --no-save playwright
        working-directory: cdrca
      - run: npx playwright install --with-deps chromium
        working-directory: cdrca
      - run: sudo apt-get install -y blender
      - run: python blaze.py doctor
      - run: python -m pytest tests
      - run: node tests/transpiler.test.js && node tests/render.test.js
        working-directory: cdrca
